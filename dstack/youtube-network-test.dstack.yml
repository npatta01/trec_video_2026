type: task
name: youtube-network-test
python: "3.12"
fleets: [cpu-exit]
backends: [digitalocean, gcp]
spot_policy: auto
max_price: 0.02
resources:
  cpu: 1..2
  memory: 512MB..4GB
  disk: 10GB..25GB
env:
  - YOUTUBE_TEST_URL
commands:
  - uv pip install "yt-dlp[default]==2026.7.4"
  - yt-dlp --simulate --no-playlist -- "$YOUTUBE_TEST_URL"
max_duration: 10m
