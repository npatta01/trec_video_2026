type: task
name: qwen35-safety-shard

image: docker.io/pytorch/pytorch@sha256:c8268a92a69bd500f8be0e665b2630ee006dadaf7bfbc24249141b15ff622755
entrypoint: /bin/bash -c
shell: bash
working_dir: /dstack/run

env:
  - HF_TOKEN=${{ secrets.hf_token }}
  - HF_HUB_DISABLE_TELEMETRY=1
  - PYTHONPATH=/dstack/run/src
  - VQA_RUNTIME_IMAGE=docker.io/pytorch/pytorch@sha256:c8268a92a69bd500f8be0e665b2630ee006dadaf7bfbc24249141b15ff622755

files:
  - ../scripts/run-qwen35-safety-shard-dstack.sh:/dstack/run/scripts/run-qwen35-safety-shard-dstack.sh
  - ../src/trec_video_2026:/dstack/run/src/trec_video_2026

commands:
  - |
    set -euo pipefail
    exec bash /dstack/run/scripts/run-qwen35-safety-shard-dstack.sh ${{ run.args }}

resources:
  gpu: A5000,A40,A6000,L4,RTX4090,RTX6000Ada:1:20GB..
  cpu: 8..
  memory: 16GB..
  disk: 40GB

backends: [runpod, vastai]
spot_policy: on-demand
max_price: 1.00
max_duration: 3h
retry:
  on_events: [no-capacity]
  duration: 30m
