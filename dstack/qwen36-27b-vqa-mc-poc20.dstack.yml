entrypoint: /bin/bash -c
shell: bash
working_dir: /dstack/run

env:
  - HF_TOKEN=${{ secrets.hf_token }}
  - HF_HUB_DISABLE_TELEMETRY=1
  - HF_CLI_MODE=direct
  - HF_CLI_VERSION=1.27.0
  - PYTHON_BIN=/usr/bin/python3
  - PYTHONPATH=/dstack/run/src
  - MODEL_ID=Qwen/Qwen3.6-27B
  - MODEL_REVISION=6a9e13bd6fc8f0983b9b99948120bc37f49c13e9
  - RUNTIME_IMAGE=docker.io/vllm/vllm-openai:v0.20.0@sha256:77797441eae630c2e79eefa03957b3d61a278670f2a9928d64ce102e7a0790cc
  - EXPERIMENT_RUN_NAME=qwen36-27b-vqa-mc-poc20-20260821-a2
  - HF_REMOTE_URI=hf://buckets/Npatta01/trec_mlm_2026/trec_video_2026/experiments/qwen36-27b-vqa-mc-poc20-20260821-a2
  - INPUT_REQUESTS=/dstack/input/requests.json
  - MEDIA_URI=hf://buckets/Npatta01/trec_mlm_2026/trec_video_2026/artifacts/vqa2025-mc-poc20-20260821-a1/media
  - MEDIA_ROOT=/dstack/input/media
  - OUTPUT_DIR=/dstack/output

files:
  - ../scripts/run_vqa_mc_qwen36_poc20.py:/dstack/run/scripts/run_vqa_mc_qwen36_poc20.py
  - ../src:/dstack/run/src
  - ../data/vqa/benchmarks/vqa-mc-poc20-20260821/inputs/requests.json:/dstack/input/requests.json

commands:
  - |
    set -euo pipefail
    mkdir -p "$OUTPUT_DIR"
    finalize() {
      workload_rc=$?
      trap - EXIT
      if [[ -n "${server_pid:-}" ]]; then
        kill "$server_pid" 2>/dev/null || true
      fi
      sync_rc=0
      if command -v hf >/dev/null 2>&1; then
        set +e
        hf buckets sync "$OUTPUT_DIR" "$HF_REMOTE_URI" --exclude "vllm-server.log"
        sync_rc=$?
        set -e
      else
        echo 'hf executable is missing; durable sync was not attempted' >&2
        sync_rc=127
      fi
      if (( workload_rc != 0 )); then
        exit "$workload_rc"
      fi
      exit "$sync_rc"
    }
    trap finalize EXIT

    "$PYTHON_BIN" -m pip install --no-cache-dir "huggingface_hub==$HF_CLI_VERSION"
    "$PYTHON_BIN" -m pip install --no-cache-dir "av==16.0.1"
    command -v hf >/dev/null || { echo 'hf executable is missing in pinned image' >&2; exit 127; }
    [[ "$(hf --version)" == "$HF_CLI_VERSION" ]] || { echo 'pinned hf CLI version mismatch' >&2; exit 78; }
    "$PYTHON_BIN" -c 'import av; print(av.__version__)'

    mkdir -p "$MEDIA_ROOT"
    hf buckets sync "$MEDIA_URI" "$MEDIA_ROOT" \
      --include "BDKkVYmWqdM.mkv" \
      --include "LAa5O3ToD2c.mkv" \
      --include "JpTsHQHzptE.mkv" \
      --include "LxZuar32o1o.mkv" \
      --include "Bvv6lMUTlEw.mkv" \
      --include "RIbj7xukchQ.mkv" \
      --include "D_HTq7IiSPo.mkv" \
      --include "LziNpkXGoDE.mkv" \
      --include "DC4FE3hI67U.mkv" \
      --include "JkfvwpRl488.mkv" \
      --include "Nvg0mgGelUU.mkv" \
      --include "Gb9otyfOuqA.mkv" \
      --include "G5AgzHKJINU.mkv" \
      --include "JJ8sKvg55sM.mkv" \
      --include "OVAy9Y-zh1E.mkv" \
      --include "KoQD9x6VrSk.mkv" \
      --include "G6zu9D0j8hk.mkv" \
      --include "LKiaCf1QZFw.mkv" \
      --include "LSz_xBDBPNc.mkv" \
      --include "O7lBcBruXHM.mkv"

    "$PYTHON_BIN" /dstack/run/scripts/run_vqa_mc_qwen36_poc20.py \
      --preflight \
      --requests "$INPUT_REQUESTS" \
      --media-root "$MEDIA_ROOT" \
      --output "$OUTPUT_DIR"

    command -v vllm >/dev/null || { echo 'vllm executable is missing' >&2; exit 127; }
    command -v curl >/dev/null || { echo 'curl executable is missing' >&2; exit 127; }
    vllm serve "$MODEL_ID" \
      --revision "$MODEL_REVISION" \
      --host 127.0.0.1 --port 8000 \
      --dtype bfloat16 \
      --max-model-len 32768 \
      --max-num-seqs 1 \
      --gpu-memory-utilization 0.95 \
      --media-io-kwargs '{"video": {"backend": "pyav"}}' \
      >"$OUTPUT_DIR/vllm-server.log" 2>&1 &
    server_pid=$!
    ready=0
    for _ in $(seq 1 120); do
      if curl --fail --silent http://127.0.0.1:8000/v1/models >/dev/null; then
        ready=1
        break
      fi
      if ! kill -0 "$server_pid" 2>/dev/null; then
        echo 'vLLM server exited during startup' >&2
        exit 78
      fi
      sleep 5
    done
    (( ready == 1 )) || { echo 'vLLM server readiness timeout' >&2; exit 78; }

    set +e
    "$PYTHON_BIN" /dstack/run/scripts/run_vqa_mc_qwen36_poc20.py \
      --run \
      --requests "$INPUT_REQUESTS" \
      --media-root "$MEDIA_ROOT" \
      --output "$OUTPUT_DIR" \
      --server-url http://127.0.0.1:8000/v1/chat/completions
    workload_rc=$?
    set -e
    exit "$workload_rc"

