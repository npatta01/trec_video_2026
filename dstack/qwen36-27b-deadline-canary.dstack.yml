type: task
name: qwen36-27b-deadline-canary-20260816-a5

image: docker.io/vllm/vllm-openai:v0.20.0@sha256:77797441eae630c2e79eefa03957b3d61a278670f2a9928d64ce102e7a0790cc
entrypoint: /bin/bash -c
shell: bash
working_dir: /dstack/run

env:
  - HF_TOKEN=${{ secrets.hf_token }}
  - HF_HUB_DISABLE_TELEMETRY=1
  - HF_CLI_MODE=direct
  - HF_CLI_VERSION=1.27.0
  - PYTHON_BIN=/usr/bin/python3
  - PYTHONPATH=/dstack/run
  - MODEL_ID=Qwen/Qwen3.6-27B
  - MODEL_REVISION=6a9e13bd6fc8f0983b9b99948120bc37f49c13e9
  - RUNTIME_IMAGE=docker.io/vllm/vllm-openai:v0.20.0@sha256:77797441eae630c2e79eefa03957b3d61a278670f2a9928d64ce102e7a0790cc
  - EXPERIMENT_RUN_NAME=qwen36-27b-deadline-canary-20260816-a5
  - HF_REMOTE_URI=hf://buckets/Npatta01/trec_mlm_2026/trec_video_2026/experiments/qwen36-27b-deadline-canary-20260816-a5
  - INPUT_REQUESTS=/dstack/input/deadline_canary_5.json
  - INPUT_WHISPER=/dstack/input/requests.accepted-whisper.json
  - MEDIA_URI=hf://buckets/Npatta01/trec_mlm_2026/trec_video_2026/artifacts/vqa2025-training-media-475-20260809-a1/media
  - MEDIA_ROOT=/dstack/input/media
  - OUTPUT_DIR=/dstack/output

files:
  - ../scripts/run_vqa_deadline_qwen36_canary.py:/dstack/run/scripts/run_vqa_deadline_qwen36_canary.py
  - ../configs/vqa/deadline_canary_5.json:/dstack/input/deadline_canary_5.json
  - ../data/vqa/benchmarks/vqa-factorial-475-20260809-f2/conditions/4b-current/payload/evidence/requests.accepted-whisper.json:/dstack/input/requests.accepted-whisper.json

commands:
  - |
    set -euo pipefail
    mkdir -p "$OUTPUT_DIR"
    finalize() {
      workload_rc=$?
      trap - EXIT
      if [[ -n "${server_pid:-}" ]]; then
        kill "$server_pid" 2>/dev/null || true
      fi
      sync_rc=0
      if command -v hf >/dev/null 2>&1; then
        set +e
        hf buckets sync "$OUTPUT_DIR" "$HF_REMOTE_URI"
        sync_rc=$?
        set -e
      else
        echo 'hf executable is missing; durable sync was not attempted' >&2
        sync_rc=127
      fi
      if (( workload_rc != 0 )); then
        exit "$workload_rc"
      fi
      exit "$sync_rc"
    }
    trap finalize EXIT
    "$PYTHON_BIN" -m pip install --no-cache-dir "huggingface_hub==$HF_CLI_VERSION"
    "$PYTHON_BIN" -m pip install --no-cache-dir "av==16.0.1"
    command -v hf >/dev/null || { echo 'hf executable is missing in pinned image' >&2; exit 127; }
    [[ "$(hf --version)" == "$HF_CLI_VERSION" ]] || { echo 'pinned hf CLI version mismatch' >&2; exit 78; }
    "$PYTHON_BIN" -c 'import av; print(av.__version__)'
    mkdir -p "$MEDIA_ROOT"
    hf buckets sync "$MEDIA_URI" "$MEDIA_ROOT" \
      --include "BDKkVYmWqdM.mkv" \
      --include "Bvv6lMUTlEw.mkv" \
      --include "DC4FE3hI67U.mkv" \
      --include "G5AgzHKJINU.mkv" \
      --include "G6zu9D0j8hk.mkv"
    "$PYTHON_BIN" /dstack/run/scripts/run_vqa_deadline_qwen36_canary.py \
      --preflight --requests "$INPUT_REQUESTS" --whisper "$INPUT_WHISPER" --output "$OUTPUT_DIR"

    command -v vllm >/dev/null || { echo 'vllm executable is missing' >&2; exit 127; }
    command -v curl >/dev/null || { echo 'curl executable is missing' >&2; exit 127; }
    vllm serve "$MODEL_ID" \
      --revision "$MODEL_REVISION" \
      --host 127.0.0.1 --port 8000 \
      --dtype bfloat16 \
      --max-model-len 32768 \
      --max-num-seqs 1 \
      --gpu-memory-utilization 0.95 \
      --media-io-kwargs '{"video": {"backend": "pyav"}}' \
      >"$OUTPUT_DIR/vllm-server.log" 2>&1 &
    server_pid=$!
    ready=0
    for _ in $(seq 1 120); do
      if curl --fail --silent http://127.0.0.1:8000/v1/models >/dev/null; then
        ready=1
        break
      fi
      if ! kill -0 "$server_pid" 2>/dev/null; then
        echo 'vLLM server exited during startup' >&2
        exit 78
      fi
      sleep 5
    done
    (( ready == 1 )) || { echo 'vLLM server readiness timeout' >&2; exit 78; }

    set +e
    "$PYTHON_BIN" /dstack/run/scripts/run_vqa_deadline_qwen36_canary.py \
      --run --requests "$INPUT_REQUESTS" --whisper "$INPUT_WHISPER" --output "$OUTPUT_DIR" \
      --server-url http://127.0.0.1:8000/v1/chat/completions
    workload_rc=$?
    set -e

    exit "$workload_rc"

resources:
  gpu:
    vendor: nvidia
    name: H100
    count: 1
    memory: 80GB..
  cpu: 16..
  memory: 128GB..
  disk: 120GB

fleets: [gpu-marketplace]
backends: [runpod, vastai]
regions: [US-KS-2, US-CA-2]
spot_policy: on-demand
max_price: 4.00
max_duration: 2h
retry:
  on_events: [no-capacity]
  duration: 30m
