type: dev-environment
name: vqa-event-map-dev-a1

image: docker.io/vllm/vllm-openai:v0.20.0@sha256:77797441eae630c2e79eefa03957b3d61a278670f2a9928d64ce102e7a0790cc
shell: bash
working_dir: /dstack/run

env:
  - HF_TOKEN=${{ secrets.hf_token }}
  - HF_HUB_DISABLE_TELEMETRY=1
  - PYTHON_BIN=/usr/bin/python3
  - PYTHONPATH=/dstack/run/src
  - EXPERIMENT_MODE=dev
  - EXPERIMENT_RUN_ID=vqa-event-map-dev-a1
  - EVENT_MAP_CONDITIONS=v-map,av-map
  - HF_INPUT_URI=hf://buckets/Npatta01/trec_video_2026/experiments/vqa-event-map-inputs-20260809-a3/inputs
  - RUNTIME_IMAGE=docker.io/vllm/vllm-openai:v0.20.0@sha256:77797441eae630c2e79eefa03957b3d61a278670f2a9928d64ce102e7a0790cc
  - RUNTIME_IMAGE_DIGEST=sha256:77797441eae630c2e79eefa03957b3d61a278670f2a9928d64ce102e7a0790cc
  - MODEL_ID=nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-NVFP4
  - MODEL_REVISION=dc5f0b0bfddf8b6e0f5891475be9af05b80126fe
  - VLLM_RESPONSE_FORMAT_SUPPORTED=1

files:
  - ../scripts/run-vqa-event-map-dstack.sh:/dstack/run/scripts/run-vqa-event-map-dstack.sh
  - ../src/trec_video_2026:/dstack/run/src/trec_video_2026

init:
  - |
    set -euo pipefail
    mkdir -p /dstack/input /dstack/output /dstack/dev
    printf '%s\n' VQA_EVENT_MAP_DEV_READY

inactivity_duration: 1h

fleets: [gpu-marketplace]
resources:
  gpu: L40S:1:48GB..
  cpu: 8..
  memory: 64GB..
  disk: 100GB

backends: [runpod, vastai]
spot_policy: on-demand
max_price: 1.00
max_duration: 4h
retry:
  on_events: [no-capacity]
  duration: 20m
