[project]
name = "trec-video-2026"
version = "0.1.0"
description = "Tools for TRECVID 2026 VQA dataset preparation"
readme = "README.md"
authors = [
    { name = "Nidhin Pattaniyil", email = "1314528+npatta01@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "yt-dlp[default]>=2026.7.4",
]

[project.scripts]
vqa-download = "trec_video_2026.vqa_download:main"
vqa-gate = "trec_video_2026.vqa_gate:main"
youtube-dataset-download = "trec_video_2026.youtube_dataset:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
