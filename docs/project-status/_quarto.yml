project:
  type: website
  output-dir: ../../reports/project-status
  render:
    - "*.qmd"

website:
  title: "TRECVID VQA Status"
  navbar:
    collapse-below: lg
    left:
      - href: index.qmd
        text: Start Here
      - href: experiment-ledger.qmd
        text: Experiment Ledger
      - href: code-map.qmd
        text: Code Map and Gaps
  page-footer:
    left: "Repository evidence through 2026-07-25"
    right: "Sanitized aggregates only"
  search: false

format:
  html:
    theme: cosmo
    css: styles.css
    embed-resources: true
    format-links: false
    metadata:
      report-ext: qmd
    toc: true
    toc-depth: 2
    toc-title: On this page
    code-copy: false
  gfm:
    metadata:
      report-ext: md
